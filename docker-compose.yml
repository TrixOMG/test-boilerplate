services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test-boilerplate
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    mongodb:
        image: mongo:7
        ports:
            - '27017:27017'
        volumes:
            - mongodata:/data/db
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: test-boilerplate-app
        ports:
            - '3000:3000'
            - '9229:9229'
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        networks:
            - app-network
        environment:
            NODE_ENV: development
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_NAME: test-boilerplate
            MONGODB_URI: mongodb://mongodb:27017/test-boilerplate
        command: npm run start:dev

volumes:
    pgdata:
    mongodata:

networks:
    app-network:
        driver: bridge

